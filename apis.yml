apis:
- name: Unison Share API
  description: >-
    The API powering the Unison Share web application, including the APIs for
    syncing code with UCM and browsing projects, branches, and definitions.
    Unison Share also acts as the OAuth2 (with PKCE) and OpenID Connect
    (subset) authentication server for UCM and Unison Cloud. The server is
    open source (Haskell/Servant); no OpenAPI document is published.
  humanURL: https://share.unison-lang.org
