aid: unison-computing
name: Unison Computing
description: >-
  Unison Computing, PBC is a public benefit corporation building the Unison
  programming language, Unison Cloud, and Unison Share. Unison is a
  statically-typed functional language where code is content-addressed and
  immutable; Unison Cloud deploys Unison services to the cloud with a function
  call, with typed service-to-service calls and typed durable storage; Unison
  Share is the community code host and package registry. Unison Share's
  open-source backend also serves as the OAuth2 (PKCE) and OpenID Connect
  authentication server for UCM and Unison Cloud, and UCM ships a built-in MCP
  server plus official LLM coding-assistant instructions for AI agents.
